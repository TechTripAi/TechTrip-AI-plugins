# The catalog's own health check, on every pull request and on main.
# It compares each entry's version with that plugin's live manifest on GitHub, so it also
# fails when an entry is bumped before the plugin's release has been pushed.
name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check.sh
